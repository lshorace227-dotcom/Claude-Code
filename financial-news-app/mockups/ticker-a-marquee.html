<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ticker Mockup A · 滚动行情条 Marquee tape</title>
<style>
  :root{--bg:#0b0e14;--panel:#141925;--panel2:#1c2333;--border:#232b3d;--text:#e6e9f0;--muted:#8b94a7;--up:#16c784;--down:#ea3943;--accent:#3b82f6;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Arial,sans-serif;}
  .mock-label{background:#1f2b1f;color:#9be3b6;font-size:12px;padding:6px 16px;border-bottom:1px solid #2c4030;}
  .mock-label b{color:#fff;}
  header.topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--border);}
  .logo{color:var(--up);font-size:24px;}
  header h1{font-size:18px;margin:0;}
  header p{margin:1px 0 0;color:var(--muted);font-size:11px;}
  /* --- the ticker tape --- */
  .ticker{position:relative;overflow:hidden;background:linear-gradient(180deg,#10141d,#0d1118);border-bottom:1px solid var(--border);white-space:nowrap;}
  .ticker::before{content:"实时 LIVE";position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;padding:0 12px;background:var(--down);color:#fff;font-size:11px;font-weight:700;z-index:2;letter-spacing:.5px;}
  .track{display:inline-flex;gap:34px;padding:11px 0 11px 90px;width:max-content;animation:scroll 48s linear infinite;}
  .ticker:hover .track{animation-play-state:paused;}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .item{display:inline-flex;align-items:baseline;gap:7px;font-size:13px;}
  .item .zh{color:var(--muted);font-size:12px;}
  .item .sym{color:var(--text);font-weight:600;}
  .item .px{color:var(--text);font-variant-numeric:tabular-nums;}
  .item .chg{font-size:12px;font-variant-numeric:tabular-nums;}
  .up{color:var(--up);} .down{color:var(--down);}
  .hint{color:var(--muted);font-size:12px;padding:14px 20px;}
  .body-fake{padding:0 20px;}
  .row{height:18px;background:var(--panel2);border-radius:6px;margin:14px 0;opacity:.5;}
  .row.s{width:40%;} .row.m{width:70%;}
</style>
</head>
<body>
  <div class="mock-label"><b>MOCKUP A</b> — 滚动行情条 / Scrolling marquee tape · 经典 CNBC 式连续横向滚动，悬停暂停。Hover to pause.</div>
  <header class="topbar">
    <span class="logo">◆</span>
    <div><h1>全球金融新闻</h1><p>Global Financial News · 中英对照</p></div>
  </header>

  <div class="ticker"><div class="track" id="track"></div></div>

  <div class="body-fake">
    <p class="hint">↑ 行情条嵌在头部下方，贯穿全站。下方为新闻列表占位。<br/>The strip sits under the header across the whole site. Mock news below. Data is simulated (random walk).</p>
    <div class="row m"></div><div class="row s"></div><div class="row m"></div><div class="row s"></div>
  </div>

<script>
const data = [
  {sym:'S&P 500', zh:'标普500', open:5123.4},
  {sym:'Nasdaq', zh:'纳斯达克', open:16012.5},
  {sym:'Dow', zh:'道指', open:38765.2},
  {sym:'Hang Seng', zh:'恒生', open:17234.6},
  {sym:'Nikkei 225', zh:'日经225', open:38920.1},
  {sym:'SSE', zh:'上证指数', open:3012.4},
  {sym:'BTC', zh:'比特币', open:90250},
  {sym:'ETH', zh:'以太坊', open:4820},
  {sym:'USD/CNY', zh:'美元/人民币', open:7.18},
  {sym:'USD/JPY', zh:'美元/日元', open:156.3},
  {sym:'Gold', zh:'黄金', open:2412.5},
  {sym:'WTI Oil', zh:'原油', open:78.6},
];
data.forEach(d => d.price = d.open * (1 + (Math.random()-0.5)*0.02));

function fmt(v){ return v >= 1000 ? v.toLocaleString('en-US',{maximumFractionDigits:0}) : v.toFixed(v<10?3:2); }

function itemHtml(d,i){
  return `<span class="item"><span class="zh">${d.zh}</span><span class="sym">${d.sym}</span>`+
         `<span class="px" data-px="${i}">${fmt(d.price)}</span>`+
         `<span class="chg" data-chg="${i}"></span></span>`;
}
// duplicate the list twice for a seamless loop
const track = document.getElementById('track');
track.innerHTML = data.map(itemHtml).join('') + data.map(itemHtml).join('');

function paint(){
  data.forEach((d,i)=>{
    const chg = (d.price-d.open)/d.open*100;
    const cls = chg>=0?'up':'down';
    const txt = (chg>=0?'▲':'▼')+Math.abs(chg).toFixed(2)+'%';
    document.querySelectorAll(`[data-px="${i}"]`).forEach(e=>e.textContent=fmt(d.price));
    document.querySelectorAll(`[data-chg="${i}"]`).forEach(e=>{e.textContent=txt;e.className='chg '+cls;});
  });
}
paint();
setInterval(()=>{ data.forEach(d=> d.price *= (1+(Math.random()-0.5)*0.004)); paint(); }, 2000);
</script>
</body>
</html>
