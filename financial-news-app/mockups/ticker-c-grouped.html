<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ticker Mockup C · 分组+迷你走势 Grouped + sparkline</title>
<style>
  :root{--bg:#0b0e14;--panel:#141925;--panel2:#1c2333;--border:#232b3d;--text:#e6e9f0;--muted:#8b94a7;--up:#16c784;--down:#ea3943;--accent:#3b82f6;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Arial,sans-serif;}
  .mock-label{background:#1f2b1f;color:#9be3b6;font-size:12px;padding:6px 16px;border-bottom:1px solid #2c4030;}
  .mock-label b{color:#fff;}
  header.topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--border);}
  .logo{color:var(--up);font-size:24px;}
  header h1{font-size:18px;margin:0;}
  header p{margin:1px 0 0;color:var(--muted);font-size:11px;}
  /* --- grouped panel --- */
  .panel{background:#0d1118;border-bottom:1px solid var(--border);}
  .bar{display:flex;align-items:center;gap:8px;padding:8px 20px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tabs button{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:999px;font-size:12px;cursor:pointer;}
  .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .collapse{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;cursor:pointer;padding:4px 8px;font-size:12px;}
  .cards{display:flex;gap:10px;overflow-x:auto;padding:4px 20px 14px;}
  .cards.hidden{display:none;}
  .card{flex:0 0 auto;min-width:170px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
  .card .name{display:flex;justify-content:space-between;align-items:baseline;}
  .card .zh{font-size:13px;}
  .card .sym{font-size:10px;color:var(--muted);}
  .card .px{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0 2px;}
  .card .chg{font-size:12px;font-variant-numeric:tabular-nums;}
  .up{color:var(--up);} .down{color:var(--down);}
  svg{display:block;margin-top:6px;}
  .hint{color:var(--muted);font-size:12px;padding:14px 20px;}
  .body-fake{padding:0 20px;} .row{height:18px;background:var(--panel2);border-radius:6px;margin:14px 0;opacity:.5;}
  .row.s{width:40%;} .row.m{width:70%;}
</style>
</head>
<body>
  <div class="mock-label"><b>MOCKUP C</b> — 分组 + 迷你走势 / Grouped tabs + sparklines · 按 指数/加密/外汇/商品 分组，每项带迷你走势图，可折叠。Tabs by asset class, mini charts, collapsible.</div>
  <header class="topbar">
    <span class="logo">◆</span>
    <div><h1>全球金融新闻</h1><p>Global Financial News · 中英对照</p></div>
  </header>

  <div class="panel">
    <div class="bar">
      <div class="tabs" id="tabs"></div>
      <button class="collapse" id="collapse">收起 ▲</button>
    </div>
    <div class="cards" id="cards"></div>
  </div>

  <div class="body-fake">
    <p class="hint">↑ 信息量最大：分类切换 + 实时迷你走势。占位更高，更像“仪表盘”。<br/>Richest option: grouped + live sparklines, more dashboard-like (taller). Simulated data.</p>
    <div class="row m"></div><div class="row s"></div><div class="row m"></div><div class="row s"></div>
  </div>

<script>
const GROUPS = [
  {key:'idx', zh:'指数', en:'Indices'},
  {key:'crypto', zh:'加密', en:'Crypto'},
  {key:'fx', zh:'外汇', en:'Forex'},
  {key:'cmd', zh:'商品', en:'Commodities'},
];
const data = [
  {g:'idx', sym:'S&P 500', zh:'标普500', open:5123.4},
  {g:'idx', sym:'Nasdaq', zh:'纳斯达克', open:16012.5},
  {g:'idx', sym:'Hang Seng', zh:'恒生', open:17234.6},
  {g:'idx', sym:'Nikkei', zh:'日经225', open:38920.1},
  {g:'idx', sym:'SSE', zh:'上证', open:3012.4},
  {g:'crypto', sym:'BTC', zh:'比特币', open:90250},
  {g:'crypto', sym:'ETH', zh:'以太坊', open:4820},
  {g:'crypto', sym:'SOL', zh:'索拉纳', open:172.4},
  {g:'fx', sym:'USD/CNY', zh:'美元/人民币', open:7.18},
  {g:'fx', sym:'USD/JPY', zh:'美元/日元', open:156.3},
  {g:'fx', sym:'EUR/USD', zh:'欧元/美元', open:1.083},
  {g:'cmd', sym:'Gold', zh:'黄金', open:2412.5},
  {g:'cmd', sym:'WTI Oil', zh:'原油', open:78.6},
];
data.forEach((d,i)=>{ d.price=d.open*(1+(Math.random()-0.5)*0.02); d.hist=Array.from({length:20},()=>d.price); d.id=i; });
let active='idx';
function fmt(v){ return v>=1000 ? v.toLocaleString('en-US',{maximumFractionDigits:0}) : v.toFixed(v<10?3:2); }

const tabsEl=document.getElementById('tabs');
tabsEl.innerHTML=GROUPS.map(g=>`<button data-g="${g.key}" class="${g.key===active?'active':''}">${g.zh} <span style="opacity:.6">${g.en}</span></button>`).join('');

function spark(d){
  const w=150,h=30,min=Math.min(...d.hist),max=Math.max(...d.hist),rng=(max-min)||1;
  const pts=d.hist.map((v,i)=>`${(i/(d.hist.length-1)*w).toFixed(1)},${(h-(v-min)/rng*h).toFixed(1)}`).join(' ');
  const col=d.hist[d.hist.length-1]>=d.hist[0]?'var(--up)':'var(--down)';
  return `<svg width="${w}" height="${h}"><polyline fill="none" stroke="${col}" stroke-width="1.5" points="${pts}"/></svg>`;
}
const cardsEl=document.getElementById('cards');
function render(){
  cardsEl.innerHTML=data.filter(d=>d.g===active).map(d=>{
    const chg=(d.price-d.open)/d.open*100, cls=chg>=0?'up':'down';
    return `<div class="card">
      <div class="name"><span class="zh">${d.zh}</span><span class="sym">${d.sym}</span></div>
      <div class="px">${fmt(d.price)}</div>
      <div class="chg ${cls}">${chg>=0?'▲':'▼'}${Math.abs(chg).toFixed(2)}%</div>
      ${spark(d)}
    </div>`;
  }).join('');
}
render();

tabsEl.addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;active=b.dataset.g;
  [...tabsEl.children].forEach(c=>c.classList.toggle('active',c===b));render();});

const collapseBtn=document.getElementById('collapse');
collapseBtn.addEventListener('click',()=>{const c=cardsEl.classList.toggle('hidden');collapseBtn.textContent=c?'展开 ▼':'收起 ▲';});

setInterval(()=>{
  data.forEach(d=>{ d.price *= (1+(Math.random()-0.5)*0.005); d.hist.push(d.price); if(d.hist.length>20) d.hist.shift(); });
  render();
}, 1500);
</script>
</body>
</html>
